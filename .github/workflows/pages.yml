name: Deploy GitHub Pages

# The app now lives on Firebase Hosting (see firebase.json). This workflow no
# longer builds/deploys the full app — it only publishes a small static
# redirect page (gh-pages-redirect/) pointing visitors at the new host.

on:
  push:
    branches:
      - main
    paths:
      - 'gh-pages-redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-redirect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch (Branch Deployment)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: gh-pages-redirect
          branch: gh-pages

      - name: Upload Pages artifact (Actions Deployment)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages-redirect

      - name: Deploy to GitHub Pages (Actions Deployment)
        id: deployment
        uses: actions/deploy-pages@v4
