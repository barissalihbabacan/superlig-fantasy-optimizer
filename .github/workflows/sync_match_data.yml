name: 🔄 Süper Lig Canlı Maç ve Sonuç Senkronizasyonu

on:
  # 1. Tek tıkla manuel tetikleme (GitHub Actions tabından)
  workflow_dispatch:
    inputs:
      round:
        description: 'Senkronize edilecek hafta (Örn: 1)'
        required: false
        default: '1'

  # 2. Maç günleri otomatik çalışma (Cuma, Cumartesi, Pazar, Pazartesi akşamları)
  schedule:
    - cron: '30 18,21,23 * * 0,1,5,6'

jobs:
  sync-and-deploy:
    name: ⚡ Maç Verilerini Güncelle ve Dağıt
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 Depoyu İndir (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔄 Maç Sonuçlarını Senkronize Et
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python3 scripts/sync_fixtures_results.py

      - name: 📦 Paketleri Kur ve Derle
        run: |
          npm ci
          npm run build

      - name: 💾 Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/ dist/
          if git diff --staged --quiet; then
            echo "ℹ️ Güncellenecek yeni veri değişikliği bulunamadı."
          else
            git commit -m "chore(data): auto-sync Süper Lig match results [skip ci]"
            git push origin main
          fi
