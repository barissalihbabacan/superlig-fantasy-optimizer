name: 🔄 TheSportsDB Süper Lig Maç Sonuçları Senkronizasyonu

on:
  workflow_dispatch: # GitHub Actions sekmesinden tek tıkla manuel tetikleme
  schedule:
    # Maç geceleri (Cuma, Cumartesi, Pazar, Pazartesi günleri 23:30 UTC)
    - cron: '30 20 * * 0,1,5,6'

jobs:
  sync-thesportsdb:
    name: ⚡ TheSportsDB Skorlarını Senkronize Et
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔄 TheSportsDB ile Skorları Senkronize Et
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY || '123' }}
        run: |
          python3 scripts/sync_thesportsdb.py

      - name: 💾 Güncellemeleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/2026-27/fixtures.json
          if git diff --staged --quiet; then
            echo "ℹ️ Yeni skor güncellemesi bulunamadı, veriler güncel."
          else
            git commit -m "chore(data): auto-sync Süper Lig match results via TheSportsDB [skip ci]"
            git push origin main
          fi
