name: 🔄 TheSportsDB Süper Lig Maç Sonuçları Senkronizasyonu

on:
  workflow_dispatch: # GitHub Actions sekmesinden tek tıkla anında çalıştırma
  schedule:
    # Maç günleri (Cuma, Cts, Pzr, Pzt) 15:00 - 22:00 UTC (18:00 - 01:00 TSİ) arası her 5 dakikada bir çalışır
    - cron: '*/5 15-22 * * 0,1,5,6'
    # Hafta içi genel kontrol: Günde 2 kez
    - cron: '0 9,15 * * 2,3,4'

jobs:
  sync-thesportsdb:
    name: ⚡ TheSportsDB Skorlarını Senkronize Et & Canlıya Al
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔄 TheSportsDB ile Skorları Senkronize Et
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY || '123' }}
        run: |
          python3 scripts/sync_thesportsdb.py

      - name: 💾 Güncellemeleri Kaydet ve Commit At
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/2026-27/fixtures.json
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Yeni skor güncellemesi bulunamadı, veriler zaten güncel."
          else
            git commit -m "chore(data): auto-sync Süper Lig match results via TheSportsDB"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Yeni skorlar başarıyla commit edilip ana dala gönderildi."
          fi

      - name: 🦀 Rust Kurulumu (Wasm için)
        if: steps.commit_step.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 📦 wasm-pack Kurulumu
        if: steps.commit_step.outputs.has_changes == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: 🟢 Node.js Kurulumu
        if: steps.commit_step.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🏗️ Web Uygulamasını Derle (Production Build)
        if: steps.commit_step.outputs.has_changes == 'true'
        run: npm ci && npm run build

      - name: 🚀 Firebase Hosting Canlıya Yayınla (Deploy)
        if: steps.commit_step.outputs.has_changes == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPERLIG_FANTASY_OPTIMIZER }}
          channelId: live
          projectId: superlig-fantasy-optimizer
